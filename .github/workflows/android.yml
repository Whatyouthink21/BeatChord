name: Android Release APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: false
        default: "prodRelease"
        type: choice
        options:
          - prodRelease
          - devDebug
          - devRelease
          - prodDebug

jobs:
  build:
    name: Android · ${{ inputs.variant || 'prodRelease' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Gradle caching + build-scan support. Mirrors what check.yml already does
    # for the dev-debug job so the release build benefits from the same cache.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Expose the SDK path and the sdkmanager binary for the steps below.
    # The GitHub runner ships the command-line tools in a couple of possible
    # places depending on image version, so discover the binary rather than
    # hard-coding one path.
    - name: Locate Android SDK
      id: sdk
      shell: bash
      run: |
        for candidate in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
          if [ -n "$candidate" ] && [ -d "$candidate" ]; then
            SDK="$candidate"
            break
          fi
        done
        echo "sdk=$SDK" >> "$GITHUB_OUTPUT"

        for b in "$SDK/cmdline-tools/latest/bin/sdkmanager" \
                 "$SDK/cmdline-tools/bin/sdkmanager" \
                 "$SDK/tools/bin/sdkmanager"; do
          if [ -x "$b" ]; then echo "sdkmanager=$b" >> "$GITHUB_OUTPUT"; echo "sdkmanager found: $b"; break; fi
        done

    # AGP will not download SDK components unless the licenses are pre-accepted
    # on the machine; without this step the first build on a fresh runner fails
    # with "Failed to install the following Android SDK packages".
    - name: Accept Android SDK licenses
      shell: bash
      run: |
        yes | "${{ steps.sdk.outputs.sdkmanager }}" --licenses >/dev/null 2>&1 || true

    # compileSdk 37, CMake 3.22.1 (for the native analyzer) and an NDK (for the
    # C/C++ toolchain CMake needs) are not all present on every runner image.
    # Install them explicitly so the build is reproducible.
    - name: Install required Android SDK components
      shell: bash
      run: |
        SM="${{ steps.sdk.outputs.sdkmanager }}"
        "$SM" --install \
          "platforms;android-37" \
          "platforms;android-36" \
          "build-tools;36.0.0" \
          "cmake;3.22.1" \
          "ndk;27.0.12077973" \
          "platform-tools"

    - name: Setup Secrets (Keystore & local.properties)
      shell: bash
      run: |
        SDK="${{ steps.sdk.outputs.sdk }}"
        # local.properties: tell Gradle where the SDK is, and pass through the
        # optional API keys. Keys that aren't set in the repo's secrets come
        # through empty, which is fine (see app/build.gradle.kts — empty is a
        # supported state, not a broken build).
        {
          echo "sdk.dir=$SDK"
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}"
        } > local.properties

        # Release signing is optional. If KEYSTORE_BASE64 is not set (e.g. on a
        # PR from a fork, where GitHub withholds secrets), skip it — the build
        # then produces unsigned APKs rather than failing. app/build.gradle.kts
        # is written for exactly this case.
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
          echo "Keystore written — will produce signed APKs."
        else
          echo "No keystore secret present — producing unsigned APKs."
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK (${{ inputs.variant || 'prodRelease' }})
      shell: bash
      run: |
        # Give the Gradle daemon a little more headroom for the release variant
        # (R8 + Compose + the native CMake build all run in one process).
        export GRADLE_OPTS="-Xmx4096m -Dfile.encoding=UTF-8"
        ./gradlew assemble${{ inputs.variant || 'prodRelease' }} --stacktrace

    - name: Determine variant paths
      id: paths
      shell: bash
      run: |
        variant="${{ inputs.variant || 'prodRelease' }}"
        # prodRelease -> flavor=prod, type=release; devDebug -> dev/debug, etc.
        flavor=$(echo "$variant" | sed -E 's/^(prod|dev)(Debug|Release|Benchmark)$/\1/')
        type=$(echo "$variant" | sed -E 's/^(prod|dev)(Debug|Release|Benchmark)$/\L\2/')
        echo "flavor=$flavor" >> "$GITHUB_OUTPUT"
        echo "type=$type" >> "$GITHUB_OUTPUT"
        echo "--- Phone APKs ---"
        ls -la "app/build/outputs/apk/$flavor/$type/" || true
        echo "--- Wear APKs ---"
        ls -la "wearos/build/outputs/apk/$flavor/$type/" || true

    - name: Upload Phone APKs
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-phone-${{ inputs.variant || 'prodRelease' }}
        path: app/build/outputs/apk/${{ steps.paths.outputs.flavor }}/${{ steps.paths.outputs.type }}/*.apk

    - name: Upload Wear OS APKs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-wear-${{ inputs.variant || 'prodRelease' }}
        path: wearos/build/outputs/apk/${{ steps.paths.outputs.flavor }}/${{ steps.paths.outputs.type }}/*.apk

    - name: Upload build reports on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: android-build-reports
        path: |
          app/build/reports/
          wearos/build/reports/
          */build/outputs/logs/
